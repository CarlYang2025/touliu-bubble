<script>
const svg=document.getElementById('chart');
const vp=document.getElementById('viewport');
let scale=1,tx=0,ty=0;
const W=1080,H=720;
function apply(){ vp.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`); }
function vbPoint(e){
  const r=svg.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)};
}
function zoomAt(px,py,factor){
  const ns=Math.min(8,Math.max(0.35,scale*factor));
  const k=ns/scale;
  tx=px-(px-tx)*k; ty=py-(py-ty)*k; scale=ns; apply();
}
svg.addEventListener('wheel',e=>{e.preventDefault();const p=vbPoint(e);zoomAt(p.x,p.y,e.deltaY<0?1.18:1/1.18);},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,tx,ty};svg.setPointerCapture(e.pointerId);svg.style.cursor='grabbing';});
svg.addEventListener('pointermove',e=>{
  if(!drag)return;const r=svg.getBoundingClientRect();
  tx=drag.tx+(e.clientX-drag.x)*(W/r.width); ty=drag.ty+(e.clientY-drag.y)*(H/r.height); apply();
});
svg.addEventListener('pointerup',e=>{drag=null;svg.style.cursor='grab';});
svg.addEventListener('pointercancel',()=>{drag=null;});
function zoomIn(){zoomAt(W/2,H/2,1.35);}
function zoomOut(){zoomAt(W/2,H/2,1/1.35);}
function reset(){scale=1;tx=0;ty=0;apply();}
</script>
</body></html>
