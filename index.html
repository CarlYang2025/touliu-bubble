 x="751.2" y="658" font-size="10" fill="#555" text-anchor="middle">100</text><text x="909.9" y="658" font-size="10" fill="#555" text-anchor="middle">300</text><text x="78" y="643.0" font-size="10" fill="#555" text-anchor="end">0%</text><text x="78" y="553.3" font-size="10" fill="#555" text-anchor="end">5%</text><text x="78" y="463.6" font-size="10" fill="#555" text-anchor="end">10%</text><text x="78" y="373.9" font-size="10" fill="#555" text-anchor="end">15%</text><text x="78" y="284.2" font-size="10" fill="#555" text-anchor="end">20%</text><text x="78" y="194.5" font-size="10" fill="#555" text-anchor="end">25%</text><text x="78" y="104.8" font-size="10" fill="#555" text-anchor="end">30%</text>
</g>
</svg>
<div id="tooltip"></div>
<script>
const svg=document.getElementById('chart');
const vp=document.getElementById('viewport');
const tip=document.getElementById('tooltip');
const sel=document.getElementById('selbox');
let scale=1,tx=0,ty=0;
const W=1080,H=720;
function apply(){ vp.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`); }
function vbPoint(e){
  const r=svg.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)};
}
function zoomAt(px,py,factor){
  const ns=Math.min(10,Math.max(0.3,scale*factor));
  const k=ns/scale; tx=px-(px-tx)*k; ty=py-(py-ty)*k; scale=ns; apply();
}
function zoomToRect(a,b,c,d){
  const x1=Math.min(a,c),y1=Math.min(b,d),x2=Math.max(a,c),y2=Math.max(b,d);
  const cx1=(x1-tx)/scale,cy1=(y1-ty)/scale,cx2=(x2-tx)/scale,cy2=(y2-ty)/scale;
  const cw=cx2-cx1,ch=cy2-cy1;
  if(cw<1e-6||ch<1e-6)return;
  const ns=Math.min(10,Math.max(0.3,Math.min(W/cw,H/ch)));
  const ccx=(cx1+cx2)/2,ccy=(cy1+cy2)/2;
  tx=W/2-ccx*ns; ty=H/2-ccy*ns; scale=ns; apply();
}
// 滚轮缩放（图表本体不移动，只围绕鼠标放大缩小）
svg.addEventListener('wheel',e=>{e.preventDefault();const p=vbPoint(e);zoomAt(p.x,p.y,e.deltaY<0?1.2:1/1.2);},{passive:false});
// 框选放大：按住左键拖出区域，松开自动放大到该区域
let selStart=null;
svg.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const p=vbPoint(e);
  selStart=p;
  sel.setAttribute('x',p.x); sel.setAttribute('y',p.y);
  sel.setAttribute('width',0); sel.setAttribute('height',0);
  sel.style.display='block';
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove',e=>{
  if(!selStart)return;
  const p=vbPoint(e);
  const x=Math.min(selStart.x,p.x),y=Math.min(selStart.y,p.y);
  sel.setAttribute('x',x); sel.setAttribute('y',y);
  sel.setAttribute('width',Math.abs(p.x-selStart.x)); sel.setAttribute('height',Math.abs(p.y-selStart.y));
});
svg.addEventListener('pointerup',e=>{
  if(!selStart)return;
  const p=vbPoint(e);
  sel.style.display='none';
  if(Math.abs(p.x-selStart.x)>15&&Math.abs(p.y-selStart.y)>15){
    zoomToRect(selStart.x,selStart.y,p.x,p.y);
  }
  selStart=null;
});
svg.addEventListener('pointercancel',()=>{sel.style.display='none';selStart=null;});

// 悬停数据卡片
document.querySelectorAll('circle[data-name]').forEach(c=>{
  c.addEventListener('mousemove',e=>{
    const d=c.dataset;
    tip.innerHTML='<div class="t-name">'+d.name+'</div>'+
      '<div>外溢成本 <b>'+d.cost+'</b></div>'+
      '<div>活跃率 <b>'+d.rate+'%</b></div>'+
      '<div>活跃行为 <b>'+d.act+'</b></div>'+
      '<div>广告阅读量 <b>'+d.adreads+'</b></div>'+
      '<div class="t-state">状态：'+d.state+'</div>';
    tip.style.display='block';
    let x=e.clientX+16,y=e.clientY+16;
    const tw=tip.offsetWidth,th=tip.offsetHeight;
    if(x+tw>window.innerWidth-8) x=e.clientX-tw-16;
    if(y+th>window.innerHeight-8) y=e.clientY-th-16;
    tip.style.left=x+'px'; tip.style.top=y+'px';
  });
  c.addEventListener('mouseleave',()=>{tip.style.display='none';});
});
function zoomIn(){zoomAt(W/2,H/2,1.4);}
function zoomOut(){zoomAt(W/2,H/2,1/1.4);}
function reset(){scale=1;tx=0;ty=0;apply();}
</script>
</body></html>
